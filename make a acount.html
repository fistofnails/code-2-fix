<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Create Account</title>
</head>
<body class="auth-body">
    <video class="video-background" autoplay muted loop playsinline preload="auto" controls="false" controlslist="nodownload nofullscreen noplaybackrate" disablepictureinpicture aria-hidden="true">
        <source src="photos/Screen%20Recording%202026-10-13%20144509.mp4" type="video/mp4">
    </video>
    <div class="video-overlay" aria-hidden="true"></div>
    <div class="sign-in-page">
        <header class="sign-in-header">
            <a href="landing page.html" class="brand" aria-label="Oceanic home">
                <div class="logo-mark">O</div>
                <span>Oceanic</span>
            </a>

            <nav class="top-nav" aria-label="Main navigation">
                <a href="#about">About</a>
                <a href="aquarium.html">Animals</a>
                <a href="#habitats">Habitats</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <main class="sign-in-form">
            <p class="eyebrow">Join the community</p>
            <h1>Create an Account</h1>
            <form data-auth="signup" novalidate>
                <div class="field-group">
                    <label for="signup-name">Full name</label>
                    <input type="text" id="signup-name" name="name" placeholder="Your name" required>
                </div>

                <div class="field-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
                </div>

                <div class="field-group">
                    <label for="signup-confirm-password">Confirm password</label>
                    <input type="password" id="signup-confirm-password" name="confirmPassword" placeholder="Repeat your password" required>
                </div>

                <button type="submit">Create Account</button>
            </form>

            <p class="status-message" aria-live="polite"></p>
            <p class="auth-switch">Already have an account? <a href="sign in.html">Sign in</a></p>
        </main>
    </div>

    <script>
        (function () {
            const USERS_KEY = 'oceanicUsers';

            function readUsers() {
                try {
                    return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
                } catch (error) {
                    return [];
                }
            }

            function writeUsers(users) {
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }

            function setStatus(form, message, type) {
                const status = form.parentElement.querySelector('.status-message');
                if (!status) return;
                status.textContent = message;
                status.classList.remove('error', 'success');
                if (type) status.classList.add(type);
            }

            const signupForm = document.querySelector('[data-auth="signup"]');
            if (signupForm) {
                signupForm.addEventListener('submit', function (event) {
                    event.preventDefault();

                    const name = document.getElementById('signup-name').value.trim();
                    const email = document.getElementById('signup-email').value.trim().toLowerCase();
                    const password = document.getElementById('signup-password').value;
                    const confirmPassword = document.getElementById('signup-confirm-password').value;

                    if (!name || !email || !password || !confirmPassword) {
                        setStatus(signupForm, 'Please fill in every field.', 'error');
                        return;
                    }

                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                        setStatus(signupForm, 'Please enter a valid email address.', 'error');
                        return;
                    }

                    if (password.length < 6) {
                        setStatus(signupForm, 'Password must be at least 6 characters long.', 'error');
                        return;
                    }

                    if (password !== confirmPassword) {
                        setStatus(signupForm, 'Passwords do not match. Please try again.', 'error');
                        return;
                    }

                    const users = readUsers();
                    const emailExists = users.some(function (user) {
                        return user.email.toLowerCase() === email;
                    });

                    if (emailExists) {
                        setStatus(signupForm, 'An account with that email already exists.', 'error');
                        return;
                    }

                    users.push({
                        name: name,
                        email: email,
                        password: password
                    });

                    writeUsers(users);
                    setStatus(signupForm, 'Account created successfully! Redirecting to sign in...', 'success');

                    setTimeout(function () {
                        window.location.href = 'sign in.html';
                    }, 900);
                });
            }
        })();
    </script>
</body>
</html>
