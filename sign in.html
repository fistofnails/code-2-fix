<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Sign In</title>
</head>
<body class="auth-body">
    <video class="video-background" autoplay muted loop playsinline preload="auto" controls="false" controlslist="nodownload nofullscreen noplaybackrate" disablepictureinpicture aria-hidden="true">
        <source src="photos/Screen%20Recording%202026-10-13%20144509.mp4" type="video/mp4">
    </video>
    <div class="video-overlay" aria-hidden="true"></div>
    <div class="sign-in-page">
        <header class="sign-in-header">
            <a href="landing page.html" class="brand" aria-label="Oceanic home">
                <div class="logo-mark">O</div>
                <span>Oceanic</span>
            </a>

            <nav class="top-nav" aria-label="Main navigation">
                <a href="#about">About</a>
                <a href="aquarium.html">Animals</a>
                <a href="#habitats">Habitats</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <main class="sign-in-form">
            <p class="eyebrow">Welcome back</p>
            <h1>Sign In to Oceanic</h1>
            <form data-auth="login" novalidate>
                <div class="field-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit">Sign In</button>
            </form>

            <p class="status-message" aria-live="polite"></p>
            <p class="auth-switch">Need an account? <a href="make a acount.html">Create one</a></p>
        </main>
    </div>

    <script>
        (function () {
            const USERS_KEY = 'oceanicUsers';
            const CURRENT_USER_KEY = 'oceanicCurrentUser';

            function readUsers() {
                try {
                    return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
                } catch (error) {
                    return [];
                }
            }

            function setStatus(form, message, type) {
                const status = form.parentElement.querySelector('.status-message');
                if (!status) return;
                status.textContent = message;
                status.classList.remove('error', 'success');
                if (type) status.classList.add(type);
            }

            const loginForm = document.querySelector('[data-auth="login"]');
            if (loginForm) {
                loginForm.addEventListener('submit', function (event) {
                    event.preventDefault();

                    const email = document.getElementById('login-email').value.trim().toLowerCase();
                    const password = document.getElementById('login-password').value;

                    if (!email || !password) {
                        setStatus(loginForm, 'Please enter both your email and password.', 'error');
                        return;
                    }

                    const users = readUsers();
                    const account = users.find(function (user) {
                        return user.email.toLowerCase() === email;
                    });

                    if (!account || account.password !== password) {
                        setStatus(loginForm, 'We could not find a matching account. Please check your details.', 'error');
                        return;
                    }

                    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
                        name: account.name,
                        email: account.email
                    }));

                    setStatus(loginForm, 'You are signed in. Redirecting to the homepage...', 'success');
                    setTimeout(function () {
                        window.location.href = 'landing page.html';
                    }, 900);
                });
            }
        })();
    </script>
</body>
</html>
