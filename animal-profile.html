    <script>
        const animals = [
            { slug: 'blue-whale', name: 'Blue Whale', type: 'Mammal', image: 'photos/blue whale.jpg', habitat: 'Open ocean', diet: 'Krill', depth: 'Surface to deep waters', speed: 'Up to 30 mph in short bursts', fact: 'The blue whale is the largest animal on Earth and can weigh more than 200 tons.', overview: 'Blue whales are gentle giants that travel across entire oceans in search of food and safe breeding areas. Their enormous bodies help them store energy while migrating long distances through cold and temperate waters.', detail: 'These filter feeders open their mouths wide and take in huge amounts of water before pushing it out through baleen plates. That allows them to trap massive numbers of tiny krill, which form the core of their diet.' },
            { slug: 'great-white-shark', name: 'Great White', type: 'Predator', image: 'photos/great.jpg', habitat: 'Temperate and tropical coastlines', diet: 'Seals, rays, fish', depth: 'Surface to deep waters', speed: 'Up to 25 mph', fact: 'Great whites have electroreceptors that help them detect hidden prey in the water.', overview: 'Great white sharks are famous for their speed, power, and highly developed senses. They often patrol coastal waters where seals and large fish are abundant, using stealth and bursts of acceleration to strike.', detail: 'Their bodies are built for efficient swimming, and their rows of sharp, serrated teeth are ideal for slicing through flesh. Even though they are apex predators, they are highly adapted to environmental changes and often move long distances as ocean temperatures shift.' },
            { slug: 'whale-shark', name: 'Whale Shark', type: 'Fish', image: 'photos/while shark.jpg', habitat: 'Tropical and warm seas', diet: 'Plankton, krill', depth: 'Surface to deeper offshore waters', speed: 'Around 3 mph cruising', fact: 'Whale sharks can grow longer than a school bus and still feed gently on tiny prey.', overview: 'Whale sharks are the biggest fish in the ocean, yet they are calm and non-aggressive. Their broad, spotted bodies make them easy to recognize, and they often gather in nutrient-rich areas where plankton blooms occur.', detail: 'Instead of hunting, whale sharks filter feed by swimming with their mouths open and pushing water through their gills. Their enormous size makes them powerful, but their feeding strategy is surprisingly gentle and efficient.' },
            { slug: 'tiger-shark', name: 'Tiger Shark', type: 'Predator', image: 'photos/tiger shark.jpg', habitat: 'Warm coastal waters', diet: 'Fish, rays, crustaceans', depth: 'Surface to deep reefs', speed: 'Up to 20 mph', fact: 'Tiger sharks are famous for eating a remarkably wide variety of prey, earning them the nickname “garbage cans of the sea.”', overview: 'Tiger sharks are highly adaptable hunters that thrive in warm coastal and offshore waters. Their distinctive striped pattern fades as they age, but their strong jaws and broad diet remain unmistakable.', detail: 'They often patrol shallow reefs, open sea channels, and nearshore zones where food sources are abundant. Their ability to eat everything from fish to crustaceans and even birds makes them one of the most versatile predators in the ocean.' },
            { slug: 'hammerhead-shark', name: 'Hammerhead', type: 'Shark', image: 'photos/hammerhead.png', habitat: 'Warm offshore waters', diet: 'Fish, rays, squid', depth: 'Surface to mid-depth', speed: '15-20 mph', fact: 'The wide head shape helps hammerheads spread out their senses and scan a larger area for prey.', overview: 'Hammerhead sharks are instantly recognizable because of their flattened, hammer-shaped heads. This unusual shape helps them improve their vision and detect electric signals from nearby animals.', detail: 'They often move in schools during certain seasons and use coordinated behavior to find food. Their sensory adaptations make them especially effective at locating prey in open water and near reefs.' },
            { slug: 'bull-shark', name: 'Bull Shark', type: 'Shark', image: 'photos/jeff.jpg', habitat: 'Coastal waters and rivers', diet: 'Fish, dolphins, rays', depth: 'Shallow to offshore', speed: 'Up to 25 mph', fact: 'Bull sharks can swim into freshwater rivers and estuaries, unlike most other sharks.', overview: 'Bull sharks are stocky, powerful predators that live in both marine and brackish water. Their ability to move between ocean and river systems makes them one of the most adaptable sharks on the planet.', detail: 'Their strong bodies and aggressive feeding style help them dominate shallow coastal habitats. This adaptability allows them to survive in changing conditions and exploit many different types of prey.' },
            { slug: 'blacktip-reef-shark', name: 'Blacktip Reef Shark', type: 'Shark', image: 'photos/blacktip reef shark.jpg', habitat: 'Coral reefs', diet: 'Small fish and crustaceans', depth: 'Shallow reef zones', speed: 'Up to 18 mph', fact: 'The blacktip at the fins is visible during fast bursts when they turn and chase prey.', overview: 'Blacktip reef sharks are agile swimmers that patrol shallow reefs. They are often seen cruising just above coral heads as they search for fish and small crustaceans.', detail: 'Their streamlined bodies and quick turns help them maneuver through tight spaces in reef systems. They are known for quick bursts of speed and a strong connection to coral reef environments.' },
            { slug: 'manta-ray', name: 'Manta Ray', type: 'Ray', image: 'photos/manta ray.jpg', habitat: 'Open tropical seas', diet: 'Plankton', depth: 'Surface to mesopelagic zones', speed: 'Up to 20 mph', fact: 'Manta rays can jump from the water in spectacular acrobatic leaps.', overview: 'Manta rays are graceful, wide-winged fish that glide through tropical seas with ease. Their large fins help them cruise effortlessly as they filter food from the water column.', detail: 'They often gather in cleaning stations where smaller fish remove parasites from their skin. Their gentle nature and enormous size make them among the most admired animals in the ocean.' },
            { slug: 'stingray', name: 'Stingray', type: 'Ray', image: 'photos/stingray.jpg', habitat: 'Sandy seabeds', diet: 'Crabs, mollusks, worms', depth: 'Shallow coastal areas', speed: '10-15 mph', fact: 'Some stingrays use their tails defensively, but they are usually calm and shy.', overview: 'Stingrays bury themselves beneath the sand to hide from predators and ambush prey. Their flat bodies are perfectly adapted for gliding over the seafloor with minimal effort.', detail: 'They use electric and chemical senses to find animals buried in sediment. Their streamlined design and camouflage make them excellent survivors in coastal ecosystems.' },
            { slug: 'sea-turtle', name: 'Sea Turtle', type: 'Reptile', image: 'photos/sea turtle.jpg', habitat: 'Coastal waters and open oceans', diet: 'Seagrass, algae, jellyfish', depth: 'Shallow to open sea', speed: 'Up to 20 mph in short bursts', fact: 'Sea turtles often return to the same nesting beach where they were born.', overview: 'Sea turtles are ancient marine reptiles that travel thousands of miles across oceans. Their strong flippers help them navigate long distances and dive to feed in coastal and pelagic habitats.', detail: 'Population declines have led to conservation protections across many regions. By grazing on seagrass and helping maintain food webs, sea turtles play a vital role in healthy marine ecosystems.' },
            { slug: 'green-sea-turtle', name: 'Green Sea Turtle', type: 'Reptile', image: 'photos/green sea turtle.jpg', habitat: 'Seagrass meadows', diet: 'Seagrass and algae', depth: 'Shallow coastal water', speed: '10-15 mph', fact: 'Adult green sea turtles are mostly herbivorous and can graze underwater meadows for hours.', overview: 'Green sea turtles spend much of their lives in shallow, warm coastal waters. Their broad beaks are perfectly suited for cropping seagrass and algae from the seafloor.', detail: 'These animals play an important role in maintaining seagrass habitats, which support many other marine species. Their feeding behavior helps keep ecosystems balanced and resilient.' },
            { slug: 'hawksbill-turtle', name: 'Hawksbill Turtle', type: 'Reptile', image: 'photos/hawksbill sea turtle.jpg', habitat: 'Coral reefs', diet: 'Sponges and small invertebrates', depth: 'Reef ledges and lagoons', speed: '10-15 mph', fact: 'Hawksbills are key reef animals because they help control sponge populations on coral reefs.', overview: 'Hawksbill turtles are smaller than many sea turtles and have a sharp, curved beak made for reaching into sponge crevices. Their presence is closely tied to healthy coral reef ecosystems.', detail: 'They spend much of their time around reefs, where they find shelter and food. By feeding on reef organisms, they help maintain the balance of complex ecosystems.' },
            { slug: 'leatherback-turtle', name: 'Leatherback', type: 'Reptile', image: 'photos/leatherback.jpg', habitat: 'Cold open seas', diet: 'Jellyfish', depth: 'Surface to deep sea', speed: 'Up to 22 mph', fact: 'Leatherbacks are the largest living turtles and can dive to great depths.', overview: 'Leatherbacks are remarkable for their size, endurance, and ability to dive deep into cold waters. Their flexible shell and powerful flippers help them travel across entire ocean basins.', detail: 'They feed almost exclusively on jellyfish, helping keep jellyfish numbers in check. Their long migrations are among the most extraordinary events in the marine world.' },
            { slug: 'clownfish', name: 'Clownfish', type: 'Fish', image: 'photos/clownfish.jpg', habitat: 'Warm coral reefs', diet: 'Algae, plankton, crustaceans', depth: 'Reef shelters', speed: 'Moderate', fact: 'Clownfish live among sea anemones and are protected by a mucus layer that prevents stings.', overview: 'Clownfish are vibrant reef fish that live among sea anemones, where they find both shelter and protection. Their bright orange bodies and white stripes make them instantly recognizable.', detail: 'They move in social groups and maintain small territories around their anemone homes. This close relationship demonstrates how reef animals depend on one another for safety and survival.' },
            { slug: 'angelfish', name: 'Angelfish', type: 'Fish', image: 'photos/anglefish.jpg', habitat: 'Coral reefs and lagoons', diet: 'Algae, sponges, plankton', depth: 'Mid reef zones', speed: 'Slow to moderate', fact: 'Angelfish are known for their shimmering patterns and strong territorial behavior.', overview: 'Angelfish are among the most visually striking reef fish. Their fins are often decorated with elegant stripes and bright colors that help them stand out among coral branches.', detail: 'They graze on algae and small reef organisms, helping keep underwater habitats healthy. Their calm movement and striking colors make them important symbols of colorful reef life.' },
            { slug: 'seahorse', name: 'Seahorse', type: 'Fish', image: 'photos/seahores.jpg', habitat: 'Seagrass beds and mangroves', diet: 'Tiny crustaceans', depth: 'Shallow coastal waters', speed: 'Very slow', fact: 'Male seahorses carry the eggs in a brood pouch until they hatch.', overview: 'Seahorses are unusual fish with curled tails and slow, deliberate movements. They move gently among seagrass and mangrove roots where they can remain hidden.', detail: 'Their upright posture and camouflage make them exceptionally hard to spot. Their unique life cycle and careful parenting behavior make them one of the ocean’s most fascinating fish.' },
            { slug: 'butterflyfish', name: 'Butterflyfish', type: 'Fish', image: 'photos/butterfly fish.jpg', habitat: 'Coral reefs', diet: 'Polyps and algae', depth: 'Shallow reef waters', speed: 'Moderate', fact: 'Butterflyfish often form pairs and remain close to specific areas of reef.', overview: 'Butterflyfish are bright, active members of reef communities. They feed on coral polyps and small invertebrates while cruising in pairs through coral gardens.', detail: 'Their colorful patterns help them blend into reefs and communicate with one another. Their presence is a sign of a healthy coral habitat.' },
            { slug: 'parrotfish', name: 'Parrotfish', type: 'Fish', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=900&q=80', habitat: 'Coral reefs', diet: 'Algae and coral', depth: 'Shallow reef areas', speed: 'Moderate', fact: 'Parrotfish bite off coral pieces and digest the algae inside, helping produce sand over time.', overview: 'Parrotfish are incredibly important to reef ecosystems because they graze algae and break down coral matter. Their beak-like mouths are adapted to scrape food off hard surfaces.', detail: 'As they feed, they help prevent algae from overrunning coral reefs. Their activity also contributes to the formation of sandy beaches and shallow lagoon bottoms.' },
            { slug: 'wrasse', name: 'Wrasse', type: 'Fish', image: 'photos/wrasse.jpg', habitat: 'Reef ledges and seagrass', diet: 'Crustaceans and worms', depth: 'Shallow reefs', speed: 'Quick', fact: 'Wrasse are known for their bright colors and quick darting movements.', overview: 'Wrasse are energetic reef fish that patrol the water column and seafloor in search of small prey. Their sharp eyesight and colorful bodies make them stand out among reef life.', detail: 'Some species even act as cleaner fish, removing parasites from larger fish. Their role in marine ecosystems helps maintain the health of other species.' },
            { slug: 'lionfish', name: 'Lionfish', type: 'Fish', image: 'photos/sealion.jpg', habitat: 'Reefs and rocky areas', diet: 'Small fish and crustaceans', depth: 'Shallow to mid-depth', speed: 'Moderate', fact: 'Lionfish have venomous spines that help deter predators.', overview: 'Lionfish are striking fish with dramatic fins and bold stripes. Their invasive spread in some regions has created major ecological concerns for native reef communities.', detail: 'They are skilled ambush predators that use their fins to herd small fish into striking range. Their ability to reproduce quickly makes them a serious challenge for local ecosystems.' },
            { slug: 'moray-eel', name: 'Moray Eel', type: 'Fish', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=900&q=80', habitat: 'Rocky crevices and reefs', diet: 'Fish and crustaceans', depth: 'Reef caves', speed: 'Moderate', fact: 'Moray eels are excellent ambush predators that hide in crevices and dart out quickly.', overview: 'Moray eels are lean, elongated predators that live among reefs and rock ledges. Their bodies are built for squeezing through tight spaces and surprising prey.', detail: 'They spend much of their time hiding in reef holes and waiting patiently for food. Their strong jaws and flexible bodies make them efficient hunters in complex habitats.' },
            { slug: 'octopus', name: 'Octopus', type: 'Cephalopod', image: 'https://images.unsplash.com/photo-1578328819058-b69f3a3d0f31?auto=format&fit=crop&w=1400&q=80', habitat: 'Rocky reefs and seafloor', diet: 'Crabs, shellfish, fish', depth: 'Shallow to deep water', speed: 'Moderate', fact: 'Octopuses have three hearts and can squeeze through tiny openings.', overview: 'Octopuses are among the smartest invertebrates in the sea. They use camouflage, problem-solving, and extraordinary flexibility to survive in complex reef environments.', detail: 'Their arms are packed with suction cups and sensitive nerve endings that help them explore and capture food. Their intelligence and ability to change shape make them one of the ocean’s most fascinating animals.' },
            { slug: 'cuttlefish', name: 'Cuttlefish', type: 'Cephalopod', image: 'https://images.unsplash.com/photo-1578328819058-b69f3a3d0f31?auto=format&fit=crop&w=1400&q=80', habitat: 'Coastal waters', diet: 'Small fish and crustaceans', depth: 'Shallow reef and sand flats', speed: 'Fast', fact: 'Cuttlefish can rapidly change color and pattern to communicate and hide.', overview: 'Cuttlefish are clever cephalopods with remarkable color-shifting abilities. They use their skin like a display screen to hide, warn, and signal to other animals.', detail: 'Their large eyes and powerful tentacles help them track prey and navigate shifting currents. They are key predators in shallow coastal waters and show remarkable adaptability.' },
            { slug: 'squid', name: 'Squid', type: 'Cephalopod', image: 'https://images.unsplash.com/photo-1578328819058-b69f3a3d0f31?auto=format&fit=crop&w=1400&q=80', habitat: 'Open ocean', diet: 'Fish and crustaceans', depth: 'Surface to deep sea', speed: 'High', fact: 'Squid can change color and release clouds of ink to escape predators.', overview: 'Squid are agile ocean swimmers with the ability to move quickly in bursts. Their soft bodies and streamlined forms allow them to dart through the water at impressive speed.', detail: 'They are important food sources for fish, sharks, and marine mammals. Their speed, intelligence, and camouflage make them essential parts of open-ocean food webs.' },
            { slug: 'jellyfish', name: 'Jellyfish', type: 'Invertebrate', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=1400&q=80', habitat: 'Open oceans and estuaries', diet: 'Plankton and small fish', depth: 'Surface to deep ocean', speed: 'Drifting currents', fact: 'Some jellyfish glow with bioluminescence, especially in deep water at night.', overview: 'Jellyfish drift with ocean currents and use their trailing tentacles to capture prey. Their transparent bodies can look delicate, but they are highly effective hunters.', detail: 'Their stinging cells help them stun or capture small animals. Jellyfish bloom events can shape food webs and influence the entire balance of a coastal ecosystem.' },
            { slug: 'sea-anemone', name: 'Sea Anemone', type: 'Cnidarian', image: 'https://images.unsplash.com/photo-1583212292454-1fe6229603b7?auto=format&fit=crop&w=1400&q=80', habitat: 'Coral reefs and rock pools', diet: 'Fish and plankton', depth: 'Shallow waters', speed: 'Stationary', fact: 'Sea anemones are related to jellyfish and corals and can live for many years.', overview: 'Sea anemones are attached animals that capture food from the water around them. Their colorful, flower-like tentacles are both beautiful and effective hunting tools.', detail: 'They provide shelter for clownfish and other small reef animals, creating important mutual relationships in reef habitats. Their presence helps support biodiversity in shallow waters.' },
            { slug: 'brain-coral', name: 'Brain Coral', type: 'Coral', image: 'https://images.unsplash.com/photo-1583212292454-1fe6229603b7?auto=format&fit=crop&w=1400&q=80', habitat: 'Tropical reefs', diet: 'Photosynthetic algae', depth: 'Shallow coral zones', speed: 'Slow growth', fact: 'Brain coral gets its name from the ridged surface that resembles a human brain.', overview: 'Brain coral forms large, rounded colonies that are some of the most recognizable structures on a reef. These colonies grow slowly but create durable shelter for many reef animals.', detail: 'They thrive in nutrient-poor waters thanks to a symbiotic relationship with algae. Their structures help reduce wave energy and provide habitats for fish, rays, and crustaceans.' },
            { slug: 'fan-coral', name: 'Fan Coral', type: 'Coral', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=1400&q=80', habitat: 'Warm reef slopes', diet: 'Plankton and dissolved nutrients', depth: 'Moderate reef depth', speed: 'Slow', fact: 'Fan coral grows in wide, layered branches that filter food from passing currents.', overview: 'Fan coral spreads out like a fan to catch drifting food carried by water movement. Its branching shape creates complex shelter and increases reef diversity.', detail: 'These coral forms are highly dependent on clear water and stable reef conditions. They help build three-dimensional habitats that houses countless creatures.' },
            { slug: 'staghorn-coral', name: 'Staghorn Coral', type: 'Coral', image: 'https://images.unsplash.com/photo-1583212292454-1fe6229603b7?auto=format&fit=crop&w=1400&q=80', habitat: 'Shallow reef crest', diet: 'Photosynthetic algae', depth: 'Shallow reef zones', speed: 'Fastest coral growth', fact: 'Staghorn coral can grow rapidly and creates important reef structure for young fish.', overview: 'Staghorn coral grows in branching formations that look like antlers. It is one of the key building blocks of tropical reefs and supports dense marine life.', detail: 'Its branching structures protect juvenile fish and invertebrates from predators. Healthy staghorn coral colonies are vital to reef resilience and coastal protection.' },
            { slug: 'soft-coral', name: 'Soft Coral', type: 'Coral', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=1400&q=80', habitat: 'Reef flats and drop-offs', diet: 'Plankton and sugars from symbiotic algae', depth: 'Shallow to mid-depth', speed: 'Moderate', fact: 'Soft corals sway with the current, giving reefs a moving, colorful appearance.', overview: 'Soft corals are flexible and often grow in feathery or branching forms. Their movement helps them capture food particles from the surrounding water.', detail: 'They are an important part of reef ecosystems because they create shelter and feeding grounds for various species. Their delicate forms make reefs look alive and layered.' },
            { slug: 'sea-otter', name: 'Sea Otter', type: 'Mammal', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=1400&q=80', habitat: 'Kelp forests', diet: 'Sea urchins, crabs, shellfish', depth: 'Nearshore kelp beds', speed: 'Fast in water', fact: 'Sea otters have the densest fur of any mammal, which keeps them warm in cold water.', overview: 'Sea otters are playful marine mammals that float among kelp forests while hunting for food. Their strong paws and tool use help them crack open shellfish and sea urchins.', detail: 'By eating sea urchins, sea otters help prevent overgrazing of kelp forests. This makes them a keystone species in coastal ecosystems and important protectors of marine habitats.' },
            { slug: 'dolphin', name: 'Dolphin', type: 'Mammal', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=1400&q=80', habitat: 'Coastal and open waters', diet: 'Fish and squid', depth: 'Surface to mid-depth', speed: 'Up to 25 mph', fact: 'Dolphins communicate with clicks and whistles and can recognize each other by sound.', overview: 'Dolphins are intelligent, highly social mammals known for their curiosity and teamwork. They travel in pods and use coordinated hunting strategies to catch fish and squid.', detail: 'Their playful behavior helps strengthen social bonds among group members. Dolphins are often used as symbols of ocean intelligence and cooperation.' },
            { slug: 'orca', name: 'Orca', type: 'Mammal', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=1400&q=80', habitat: 'All oceans', diet: 'Fish, seals, squid', depth: 'Surface to deep ocean', speed: 'Up to 34 mph', fact: 'Orcas are apex predators and are also highly intelligent, with different populations showing unique hunting styles.', overview: 'Orcas are among the most powerful marine mammals and are often considered the ocean’s top predators. They live in family groups and use coordinated teamwork to hunt successfully.', detail: 'Their broad diet and adaptable behavior allow them to thrive in many ocean regions. Orcas are famous for their striking black-and-white patterns and complex social structure.' },
            { slug: 'narwhal', name: 'Narwhal', type: 'Mammal', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=1400&q=80', habitat: 'Arctic waters', diet: 'Fish and squid', depth: 'Deep Arctic seas', speed: 'Moderate', fact: 'The narwhal’s tusk is actually a long tooth that can extend beyond the mouth.', overview: 'Narwhals are medium-sized whales that live in icy Arctic waters. Their long tusks and pale skin make them striking and unusual among marine mammals.', detail: 'They dive deep beneath sea ice to find food, and their behavior is closely linked to Arctic ecosystems. Narwhals are extraordinary examples of adaptation to extreme environments.' },
            { slug: 'beluga-whale', name: 'Beluga Whale', type: 'Mammal', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=1400&q=80', habitat: 'Arctic and subarctic seas', diet: 'Fish and crustaceans', depth: 'Shallow to deep coastal waters', speed: 'Moderate', fact: 'Belugas are often called “canaries of the sea” because of their wide range of vocal sounds.', overview: 'Beluga whales are recognizable by their pale skin and expressive faces. They are highly social animals that form groups and communicate using a wide variety of vocalizations.', detail: 'They often travel in pods and adapt well to icy conditions by swimming through cracks in sea ice. Their intelligence and vocal communication make them one of the most engaging marine mammals.' },
            { slug: 'salmon', name: 'Salmon', type: 'Fish', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=900&q=80', habitat: 'Rivers and coastal oceans', diet: 'Crustaceans and fish', depth: 'Freshwater to sea', speed: 'Strong bursts', fact: 'Salmon often return to the exact river where they were born to spawn.', overview: 'Salmon are famous for their long migrations between freshwater rivers and the ocean. Their life cycle is a remarkable example of adaptation and survival.', detail: 'They travel thousands of miles and can leap over waterfalls to reach spawning grounds. Their presence supports countless ecosystems and fisheries around the world.' },
            { slug: 'herring', name: 'Herring', type: 'Fish', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=900&q=80', habitat: 'Cold coastal waters', diet: 'Plankton', depth: 'Surface to mid-depth', speed: 'Fast schooling', fact: 'Herring form enormous schools that can contain millions of fish for protection.', overview: 'Herring are small, schooling fish that play a major role in ocean food webs. They are eaten by whales, sharks, birds, and larger fish.', detail: 'Their schooling behavior reduces the chance of predators catching any one fish. This makes them one of the most important prey species in the sea.' },
            { slug: 'sardine', name: 'Sardine', type: 'Fish', image: 'https://images.unsplash.com/photo-1544551763-46a013bb70b5?auto=format&fit=crop&w=900&q=80', habitat: 'Temperate and tropical coastal waters', diet: 'Plankton', depth: 'Surface waters', speed: 'Schooling bursts', fact: 'Sardines are some of the most abundant fish in the world.', overview: 'Sardines travel in large schools to protect themselves from predators. Their dense shoals can turn the ocean surface into a moving silver ribbon.', detail: 'They graze on plankton and support many larger marine animals. Their abundance helps sustain important coastal ecosystems and fisheries.' },
            { slug: 'goby', name: 'Goby', type: 'Fish', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=900&q=80', habitat: 'Reefs and estuaries', diet: 'Algae and tiny crustaceans', depth: 'Shallow water', speed: 'Quick', fact: 'Some gobies live in symbiosis with shrimp, sharing burrows safe from predators.', overview: 'Goby fish are small but highly adaptable reef dwellers. They occupy a wide range of habitats, from mangroves to coral reefs.', detail: 'Many species are strongly tied to shelters and burrows, which provide protection from predators. Their relationships with other reef animals show the complexity of seabed ecosystems.' },
            { slug: 'pufferfish', name: 'Pufferfish', type: 'Fish', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=900&q=80', habitat: 'Reefs and warm shallows', diet: 'Crustaceans and algae', depth: 'Shallow reef waters', speed: 'Slow', fact: 'Pufferfish can inflate their bodies like a balloon to deter predators.', overview: 'Pufferfish are famous for their swollen appearance when threatened. Their bodies are built for defense, and some species are also highly toxic.', detail: 'This defense strategy helps them survive in crowded reef ecosystems. Their ability to adapt to different diets also makes them resilient coastal species.' },
            { slug: 'triggerfish', name: 'Triggerfish', type: 'Fish', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=900&q=80', habitat: 'Coral reefs', diet: 'Crustaceans and algae', depth: 'Reef ledges', speed: 'Moderate', fact: 'Triggerfish can use their strong mouths to pry shellfish off rocks.', overview: 'Triggerfish are sturdy reef fish known for their territorial habits and strong jaws. They often defend the same area against intruders and float near coral heads.', detail: 'Their feeding behavior can shape the reef by opening spaces and clearing algae. They are powerful members of shallow reef communities.' },
            { slug: 'surgeonfish', name: 'Surgeonfish', type: 'Fish', image: 'https://images.unsplash.com/photo-1524704796725-9fc3044a58b2?auto=format&fit=crop&w=900&q=80', habitat: 'Reef flats', diet: 'Algae and plankton', depth: 'Shallow to mid-depth', speed: 'Moderate', fact: 'Surgeonfish have sharp blades near their tails used for defense.', overview: 'Surgeonfish are bright reef grazers that frequently move in small schools. Their streamlined bodies and bold colors make them easy to spot around coral.', detail: 'They feed on algae and tiny drifting organisms while also helping keep reef surfaces clear. Their presence indicates a healthy, productive reef system.' },
